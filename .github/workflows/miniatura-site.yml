name: Gerar miniatura real do site 2S
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/miniatura-site.yml'
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capturar o site real no tamanho de celular
        run: |
          python3 -m http.server 8765 >/tmp/2s-http.log 2>&1 &
          sleep 2
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:540,height:850},deviceScaleFactor:2});
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
            const fs=require('fs');
            for(const quality of [72,65,55,45,35]){
              await page.screenshot({path:'miniatura-site-v2.jpg',type:'jpeg',quality,clip:{x:0,y:0,width:540,height:560}});
              const bytes=fs.statSync('miniatura-site-v2.jpg').size;
              console.log('JPEG quality',quality,'bytes',bytes);
              if(bytes<=580000)break;
            }
            if(fs.statSync('miniatura-site-v2.jpg').size>580000)throw new Error('Miniatura acima de 580 KB');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Publicar captura sem modificar o site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniatura-site-v2.jpg
          git commit -m "Adicionar miniatura JPEG otimizada do site real" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
